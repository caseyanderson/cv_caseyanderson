[project]
name = "cv-caseyanderson"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "beautifulsoup4>=4.15.0",
    "jupyterlab>=4.6.4",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
